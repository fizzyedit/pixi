# Checks every pull request and every push to main: formatting, a build for each desktop OS, the
# build's `test` step if it has one, and (never failing the run) a build against fizzy main.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: fizzyedit/plugin-build-action/.github/workflows/check.yml@v7
    with:
      zig-version: "0.16.0"
    # secrets:
    #   build_env: ${{ secrets.MY_BUILD_ENV }}   # as in release.yml, if the build needs one
